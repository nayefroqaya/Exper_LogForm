# ============================================================
# LogFormer Multi-Source Cross-Dataset Configuration
# ============================================================
#
# Supports:
#   - 1, 2, or 3 SOURCE datasets
#   - exactly 1 TARGET dataset
#
# Current example:
#   Sources = BGL + HDFS
#   Target  = TH_1G
#
# Source pretraining:
#   FULL source training sets
#   normal + anomaly
#
# Target adaptation:
#   target_train_fraction = 0.20
#   -> 20% target NORMAL train blocks
#   +  20% target ANOMALY train blocks
#
# This keeps LogFormer supervised.
#
# Window size = 120 for your controlled/fair comparison.
# ============================================================


# ============================================================
# Experiment selection
# ============================================================

setting: cross_dataset

# ------------------------------------------------------------
# Choose 1, 2, or 3 source datasets.
#
# ONE SOURCE example:
#
# source_dataset_names:
#   - BGL
#
# TWO SOURCE example:
#
# source_dataset_names:
#   - BGL
#   - HDFS
#
# THREE SOURCE example:
#
# source_dataset_names:
#   - BGL
#   - HDFS
#   - SP_150MB_ratio
#
# ------------------------------------------------------------

source_dataset_names:
  - BGL
  - HDFS


# Exactly ONE target.
# Target must NOT also appear in source_dataset_names.

target_dataset_name: TH_1G


# ============================================================
# Window / sequence
# ============================================================

# Your comparison setting
window_size: 120

# Existing block/group column
block_col: Node_block_id

seed: 123


# ============================================================
# Output directories
# ============================================================

# Preprocessor writes NPZ files here
output_dir: preprocess/preprocessed_data

# Train/tune read NPZ files here
preprocessed_dir: preprocess/preprocessed_data

result_dir: result

checkpoint_dir: checkpoints


# ============================================================
# Embedding
# ============================================================

embedding_model: distilbert-base-nli-mean-tokens

embed_batch_size: 128

# null = automatically use CUDA if available
device: null


# ============================================================
# SUPERVISED target adaptation
# ============================================================

# IMPORTANT:
#
# 0.20 means:
#
#   20% of target NORMAL training blocks
#                +
#   20% of target ANOMALOUS training blocks
#
# It does NOT mean normal-only.
#
# Examples:
#   0.0125 = 1.25%
#   0.025  = 2.5%
#   0.05   = 5%
#   0.10   = 10%
#   0.20   = 20%
#   1.00   = 100%
#
target_train_fraction: 0.20

target_sampling_seed: 123


# ============================================================
# Dataset registry
# ============================================================

datasets:

  # ----------------------------------------------------------
  # BGL
  # ----------------------------------------------------------
  BGL:

    train_pkl: /storage/home/roqaya/LWADLS/datasets/BGL/1_BGL_Splitted_Datasets/train_df.pkl

    val_pkl: /storage/home/roqaya/LWADLS/datasets/BGL/1_BGL_Splitted_Datasets/val_df.pkl

    test_pkl: /storage/home/roqaya/LWADLS/datasets/BGL/1_BGL_Splitted_Datasets/test_df.pkl

    # Recreate non-overlapping windows from chronological row order.
    #
    # window_size=120:
    # rows 0-119    -> sequence 0
    # rows 120-239  -> sequence 1
    # ...
    sequence_mode: fixed_nonoverlap_rows

    block_length_mode: exact

    strict_split_overlap_check: false


  # ----------------------------------------------------------
  # HDFS
  # ----------------------------------------------------------
  HDFS:

    train_pkl: /storage/home/roqaya/LWADLS/datasets/HDFS/1_HDFS_Splitted_Datasets/train_df.pkl

    val_pkl: /storage/home/roqaya/LWADLS/datasets/HDFS/1_HDFS_Splitted_Datasets/val_df.pkl

    test_pkl: /storage/home/roqaya/LWADLS/datasets/HDFS/1_HDFS_Splitted_Datasets/test_df.pkl

    # HDFS is naturally grouped by BlockId / Node_block_id.
    sequence_mode: existing_blocks

    # Keep full variable-length HDFS block.
    # LogFormer's DataGenerator pads/truncates each block to 120.
    block_length_mode: keep_variable

    # Important for HDFS:
    # stop if the same BlockId is in more than one split.
    strict_split_overlap_check: true


  # ----------------------------------------------------------
  # Thunderbird 1G
  # ----------------------------------------------------------
  TH_1G:

    train_pkl: /storage/home/roqaya/LWADLS/datasets/TH_1G/1_TH_1G_Splitted_Datasets/train_df.pkl

    val_pkl: /storage/home/roqaya/LWADLS/datasets/TH_1G/1_TH_1G_Splitted_Datasets/val_df.pkl

    test_pkl: /storage/home/roqaya/LWADLS/datasets/TH_1G/1_TH_1G_Splitted_Datasets/test_df.pkl

    # Your PKLs already contain Node_block_id.
    sequence_mode: existing_blocks

    # If every Node_block_id has exactly 120 rows, use exact.
    block_length_mode: exact

    strict_split_overlap_check: false


  # ----------------------------------------------------------
  # Spirit
  # ----------------------------------------------------------
  SP_150MB_ratio:

    train_pkl: /storage/home/roqaya/LWADLS/datasets/SP_150MB_ratio/1_SP_150MB_ratio_Splitted_Datasets/train_df.pkl

    val_pkl: /storage/home/roqaya/LWADLS/datasets/SP_150MB_ratio/1_SP_150MB_ratio_Splitted_Datasets/val_df.pkl

    test_pkl: /storage/home/roqaya/LWADLS/datasets/SP_150MB_ratio/1_SP_150MB_ratio_Splitted_Datasets/test_df.pkl

    sequence_mode: existing_blocks

    # If every Node_block_id has exactly 120 rows, use exact.
    block_length_mode: exact

    strict_split_overlap_check: false


# ============================================================
# LogFormer model
# ============================================================

embedding_dim: 768

num_layers: 1

adapter_size: 64

nhead: 8

dropout: 0.1

feedforward_multiplier: 4


# ============================================================
# SOURCE PRETRAINING
# ============================================================

# classifier here means the standard source architecture.
# The whole source model is optimized during source pretraining.

source_mode: classifier

source_batch_size: 64

source_epochs: 5

source_lr: 0.00001


# ============================================================
# TARGET TUNING
# ============================================================

# adapter = LogFormer adapter tuning

tune_mode: adapter

target_batch_size: 64

target_epochs: 20

target_lr: 0.00001


# Original LogFormer tuning removes source fc1 weights
# and learns a new target classifier head.

reinitialize_classifier: true


# ============================================================
# OPTIONAL checkpoint overrides
# ============================================================
#
# Normally LEAVE THESE COMMENTED.
#
# The scripts automatically create names based on the selected
# source datasets.
#
# Examples:
#
# source_dataset_names:
#   - BGL
# gives:
# checkpoints/train_BGL_classifier_1_64_1e-05-best.pt
#
# source_dataset_names:
#   - BGL
#   - HDFS
# gives:
# checkpoints/train_BGL_HDFS_classifier_1_64_1e-05-best.pt
#
# source_dataset_names:
#   - BGL
#   - HDFS
#   - SP_150MB_ratio
# gives:
# checkpoints/train_BGL_HDFS_SP_150MB_ratio_classifier_1_64_1e-05-best.pt
#
# You only need an explicit override if you want a custom name.
#
# source_best_checkpoint: checkpoints/custom_source_best.pt
# source_latest_checkpoint: checkpoints/custom_source_latest.pt
#
# target_best_checkpoint: checkpoints/custom_target_best.pt
# target_latest_checkpoint: checkpoints/custom_target_latest.pt